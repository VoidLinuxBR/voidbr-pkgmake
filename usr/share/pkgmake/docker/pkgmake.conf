# /etc/pkgmake.conf dentro do container (pkgmake-docker)
# PACKAGER, assinatura e chave vêm da configuração do host via linha de comando.
# Não defina PRIVKEY aqui: este arquivo é lido depois dos argumentos e apagaria o --privkey.
PKGDEST=/repo
PACKAGER="pkgmake-docker <builder@localhost>"
SYNCDEPS=0
CLEANUP=0
SIGNPKG=0
REINDEX_FORCE=0
VERBOSE=0
